name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: pnpm install

      # Validate the signing key format before passing it to tauri-action.
      # Minisign private keys have two lines:
      #   Line 1: "untrusted comment: ..." header
      #   Line 2: base64-encoded key data (A-Za-z0-9+/= only, no spaces)
      # If the key is missing or malformed, the build proceeds without signing.
      - name: Validate updater signing key
        id: signing
        shell: bash
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set. Building without updater signing."
          elif ! echo "$SIGNING_KEY" | head -1 | grep -q "^untrusted comment:"; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY has invalid format (missing 'untrusted comment:' header). Building without updater signing. Please regenerate with: pnpm tauri signer generate"
          else
            # Validate that line 2 (base64 key body) contains only valid base64 characters.
            # Invalid chars (e.g. spaces from copy-paste errors) cause "Invalid symbol" decode failures.
            KEY_BODY=$(echo "$SIGNING_KEY" | sed -n '2p' | tr -d '\r')
            if [ -z "$KEY_BODY" ]; then
              echo "has_key=false" >> "$GITHUB_OUTPUT"
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY is missing the base64 key data (line 2). Please regenerate with: pnpm tauri signer generate"
            elif echo "$KEY_BODY" | grep -q '[^A-Za-z0-9+/=]'; then
              echo "has_key=false" >> "$GITHUB_OUTPUT"
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY base64 body contains invalid characters (likely spaces from copy-paste). Please re-copy the key ensuring no extra whitespace, or regenerate with: pnpm tauri signer generate"
            else
              echo "has_key=true" >> "$GITHUB_OUTPUT"
              echo "Signing key validated successfully."
            fi
          fi
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # When signing key is unavailable or invalid, remove updater signing config
      # from tauri.conf.json so Tauri doesn't attempt to decode a bad key.
      - name: Disable updater signing if key is invalid
        if: steps.signing.outputs.has_key != 'true'
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            delete c.bundle.createUpdaterArtifacts;
            if (c.plugins?.updater) delete c.plugins.updater.pubkey;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
            console.log('Disabled updater signing in tauri.conf.json');
          "

      # tauri-action handles:
      # 1. Building the app with --target
      # 2. Signing updater artifacts (.sig files) when TAURI_SIGNING_PRIVATE_KEY is set
      # 3. Creating/updating the GitHub release with all artifacts + latest.json
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.signing.outputs.has_key == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.signing.outputs.has_key == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          args: --target ${{ matrix.target }}
          tauriScript: pnpm tauri
          # Only create release on tag push, not workflow_dispatch
          tagName: ${{ github.ref_name }}
          releaseName: "VRCMemory ${{ github.ref_name }}"
          releaseBody: |
            VRCMemory の新しいバージョンです。
            インストール済みの方はアプリ内で自動アップデート通知が届きます。
          releaseDraft: true
          prerelease: false
          # Generate latest.json for the updater
          updaterJsonPreferNsis: true
